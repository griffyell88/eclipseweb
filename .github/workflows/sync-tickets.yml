# Eclipse Portal — Ticket Tool intake → Driver Info board
# Polls Discord every 30 min for new ticket channels, parses the intake form,
# and adds new drivers to the portal driver DB. See scripts/sync-tickets.mjs
# for the one-time bot setup.
#
# INERT until these repo secrets exist (Settings → Secrets → Actions):
#   DISCORD_BOT_TOKEN · SUPABASE_URL · SUPABASE_SERVICE_ROLE_KEY

name: Sync Tickets

on:
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes (offset from :00 rush)
  workflow_dispatch: {}       # manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if secrets not configured
        id: gate
        run: |
          if [ -z "${{ secrets.DISCORD_BOT_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secrets not set — skipping (this is fine until you enable the sync)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Sync
        if: steps.gate.outputs.configured == 'true'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-tickets.mjs
