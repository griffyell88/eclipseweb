<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Eclipse Competition</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0a0c" />
<link rel="icon" href="/assets/icon-white.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,700;0,800;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a0c;
    color: #f5f5f2;
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; padding: 40px; text-align: center;
    background-image:
      radial-gradient(circle at 50% 40%, rgba(138,0,230,0.18), transparent 60%),
      repeating-linear-gradient(-45deg, transparent 0 80px, rgba(255,255,255,0.02) 80px 81px);
  }
  img { width: 190px; height: auto; }
  .code {
    font-family: 'Saira Condensed', sans-serif;
    font-style: italic; font-weight: 800;
    font-size: clamp(72px, 18vw, 160px);
    line-height: 0.9;
    background: linear-gradient(90deg, #8a00e6, #a733ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h1 {
    font-family: 'Saira Condensed', sans-serif;
    font-style: italic; font-weight: 700;
    font-size: 26px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  p { color: #b355ff; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  a {
    font-family: 'Saira Condensed', sans-serif;
    font-style: italic; font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.08em;
    text-decoration: none; padding: 12px 22px;
    border: 1px solid #f5f5f2; color: #f5f5f2;
    transition: background .2s, color .2s, border-color .2s;
  }
  a.primary { background: #8a00e6; border-color: #8a00e6; color: #fff; }
  a.primary:hover { background: #a733ff; border-color: #a733ff; }
  a:not(.primary):hover { background: #f5f5f2; color: #0a0a0c; }
</style>
</head>
<body>
  <img src="/assets/logo-white.png" alt="Eclipse Competition" />
  <div class="code">404</div>
  <h1>You've run wide at turn one</h1>

  <div class="row">
    <a class="primary" href="/">Back to the grid →</a>

  </div>
</body>
</html>
