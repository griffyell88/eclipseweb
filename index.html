  ]

<script>
  // Set tweak defaults from localStorage before React mounts so there's no FOUC
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "purple",
    "hero": "full",
    "density": "normal"
  }/*EDITMODE-END*/;
  (function(){
    // localStorage throws in Safari with cookies blocked and in some managed
    // browsers. Unguarded, that error here killed the page before it painted.
    var read = function(k){ try { return localStorage.getItem(k); } catch (e) { return null; } };
    var html = document.documentElement;
    html.dataset.accent  = read('ec-accent')  || TWEAK_DEFAULTS.accent;
    html.dataset.hero    = read('ec-hero')    || TWEAK_DEFAULTS.hero;
    html.dataset.density = read('ec-density') || TWEAK_DEFAULTS.density;
  })();
</script>
